<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tri aktívne body na obrázku vysvetľujú rozdiel medzi rýchlosťou svetla a zvuku.">
  <title>Čo je rýchlejšie: svetlo alebo zvuk?</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Čo je rýchlejšie: svetlo alebo zvuk?</h1>
    <p>Ukážte na bod alebo naň prejdite klávesom Tab.</p>

    <figure class="hotspot-image">
      <img src="img/sddefault.jpg" alt="Dvaja ľudia skúšajú, či je rýchlejšie svetlo telefónu alebo zvuk. Na obrázku je otázka Which is faster?" width="640" height="480">

      <div class="hotspot hotspot--left" style="--x: 67%; --y: 55%">
        <button class="hotspot__dot" type="button" aria-label="Zvuk"></button>
        <div class="hotspot__panel">
          <h2>Zvuk</h2>
          <p>Zvuk sa vo vzduchu pri teplote 20 °C šíri rýchlosťou približne 343 m/s. Na vzdialenosť 10 metrov potrebuje asi 0,03 sekundy.</p>
        </div>
      </div>

      <div class="hotspot hotspot--left" style="--x: 60.5%; --y: 25.5%">
        <button class="hotspot__dot" type="button" aria-label="Prostredie"></button>
        <div class="hotspot__panel">
          <h2>Prostredie</h2>
          <p>Zvuk potrebuje na šírenie látkové prostredie, napríklad vzduch. Vo vákuu sa nešíri, zatiaľ čo svetlo áno.</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 52%; --y: 44.75%">
        <button class="hotspot__dot" type="button" aria-label="Svetlo"></button>
        <div class="hotspot__panel">
          <h2>Svetlo</h2>
          <p>Svetlo sa vo vákuu šíri rýchlosťou 299 792 458 m/s. Preto blesk vidíme skôr, než počujeme hrom.</p>
        </div>
      </div>
    </figure>

    <p class="image-source">Zdroj obrázka: <a href="https://www.youtube.com/watch?v=XFUtJdAIxkY&t=6684s">ZIAS! a B.Lou – pokus so svetlom a zvukom</a>.</p>
    <p class="conclusion">Svetlo je rýchlejšie ako zvuk.</p>
  </main>
</body>
</html>
