<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiná v Bratislave</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/parsers.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-3">Kiná v Bratislave</h1>

    <p id="status" role="status" aria-live="polite">Programy sa načítavajú…</p>
    <div class="controls mb-3">
      <button id="refresh" type="button">Aktualizovať všetko</button>
      <label class="form-check mb-0">
        <input id="use-local" class="form-check-input" type="checkbox" checked>
        <span class="form-check-label">Načítať lokálne kópie</span>
      </label>
    </div>

    <div id="filters" class="mb-3" role="group" aria-label="Zobrazené kiná"></div>
    <div id="cards" class="row g-3"></div>
  </main>
</body>
</html>
